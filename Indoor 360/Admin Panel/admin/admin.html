<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor Nav - Admin Panel</title>
    <link rel="stylesheet" href="admin.css?v=2">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <!-- Main Application -->
    <div id="app-container">

        <!-- Sidebar Navigation -->
        <nav class="sidebar glass">
            <div class="sidebar-header">
                <h1>Indoor Nav Admin</h1>
            </div>
            <ul class="nav-links">
                <li><button class="nav-link active" data-target="scenes"><i class="ph ph-panorama"></i> Scenes Manager</button></li>
                <li><button class="nav-link" data-target="globals"><i class="ph ph-gear"></i> Global Settings</button></li>
                <li><button class="nav-link" data-target="labels"><i class="ph ph-tag"></i> Map Labels</button></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- 1. SCENES MANAGER -->
            <section id="scenes" class="section active">
                <div class="section-header">
                    <h2>Scenes Manager</h2>
                    <button class="btn btn-primary" id="btn-add-scene"><i class="ph ph-plus"></i> Add Scene</button>
                </div>
                <div class="table-container glass">
                    <table id="scenes-table">
                        <thead>
                            <tr>
                                <th>Scene ID</th>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Panorama URL</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 2. GLOBAL SETTINGS -->
            <section id="globals" class="section">
                <div class="section-header">
                    <h2>Global Settings</h2>
                    <button class="btn btn-primary" id="btn-save-globals"><i class="ph ph-floppy-disk"></i> Save Settings</button>
                </div>
                <div class="glass" style="padding: 1.5rem; border-radius: 0.75rem;">
                    <form id="globals-form">
                        <div class="form-group">
                            <label>First Scene ID</label>
                            <input type="text" id="global-first-scene" class="form-control" placeholder="e.g. scene1">
                        </div>
                        <div class="form-group">
                            <label>Scene Fade Duration (ms)</label>
                            <input type="number" id="global-fade" class="form-control" value="1200">
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="global-autoload"> Auto Load
                            </label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="global-compass"> Compass
                            </label>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 3. MAP LABELS -->
            <section id="labels" class="section">
                <div class="section-header">
                    <h2>Map Labels</h2>
                    <button class="btn btn-primary" id="btn-add-label"><i class="ph ph-plus"></i> Add Label</button>
                </div>
                <div class="table-container glass">
                    <table id="labels-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Text</th>
                                <th>Coords (X,Y)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- Modals Container -->

    <!-- Scene Modal -->
    <div id="modal-scene" class="modal-overlay">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3 id="scene-modal-title">Edit Scene</h3>
                <button class="modal-close"><i class="ph ph-x"></i></button>
            </div>
            <form id="scene-form">
                <div class="form-group">
                    <label>Scene ID (e.g. scene1)</label>
                    <input type="text" id="scene-id" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="scene-title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="scene-description" class="form-control" rows="3" placeholder="Scene description (optional)"></textarea>
                </div>
                <div class="form-group">
                    <label>Cloudinary Image (360° Panorama)</label>
                    <div style="display:flex; gap:1rem;">
                        <input type="text" id="scene-panorama" class="form-control" required readonly placeholder="Upload an image ->">
                        <button type="button" id="btn-upload-cloudinary" class="btn btn-secondary">Upload</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Audio File Path (Optional)</label>
                    <input type="text" id="scene-audio" class="form-control" placeholder="e.g. audio/cv_raman.mp3">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>HFOV</label>
                        <input type="number" id="scene-hfov" class="form-control" value="110">
                    </div>
                    <div class="form-group">
                        <label>North Offset</label>
                        <input type="number" id="scene-north" class="form-control" value="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Map Pos X</label>
                        <input type="number" id="scene-map-x" class="form-control" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Map Pos Y</label>
                        <input type="number" id="scene-map-y" class="form-control" step="0.1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Hotspots (Raw JSON Array)</label>
                    <textarea id="scene-hotspots" class="form-control" rows="8" style="font-family: monospace;">[]</textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Scene</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Label Modal -->
    <div id="modal-label" class="modal-overlay">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3 id="label-modal-title">Edit Label</h3>
                <button class="modal-close"><i class="ph ph-x"></i></button>
            </div>
            <form id="label-form">
                <div class="form-group">
                    <label>Label ID</label>
                    <input type="text" id="label-id" class="form-control" required placeholder="label_123">
                </div>
                <div class="form-group">
                    <label>Text</label>
                    <input type="text" id="label-text" class="form-control" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>X Position</label>
                        <input type="number" id="label-x" class="form-control" required step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Y Position</label>
                        <input type="number" id="label-y" class="form-control" required step="0.1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Size</label>
                        <input type="number" id="label-size" class="form-control" value="6">
                    </div>
                    <div class="form-group">
                        <label>Rotation</label>
                        <input type="number" id="label-rotation" class="form-control" value="0">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Label</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="../config.js"></script>
    <script src="admin.js?v=2"></script>
</body>
</html>
